# Server setup: PostgreSQL + the app + Caddy (automatic HTTPS). See docs/DEPLOYMENT.md.
#   cp deploy/.env.example deploy/.env && cp deploy/app.env.example deploy/app.env   (then edit both)
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: leads
      POSTGRES_USER: leads
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leads -d leads"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./app.env
    environment:
      NODE_ENV: production
      DATABASE_PROVIDER: postgresql
      DATABASE_URL: postgresql://leads:${POSTGRES_PASSWORD}@db:5432/leads?connection_limit=10
      HOST: 0.0.0.0
      PORT: "3000"
      # Caddy is the one proxy in front of the app.
      TRUST_PROXY: "1"
      PUBLIC_BASE_URL: https://${DOMAIN:?Set DOMAIN in deploy/.env}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
  caddy_config:
